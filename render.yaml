services:
  - type: web
    name: leuce-mintha-discord-bot
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: BOT_PREFIX
        value: lm!
      - key: MAX_HISTORY
        value: "16"
      - key: MAX_OUTPUT_TOKENS
        value: "768"
      - key: MAX_INPUT_CHARS
        value: "6000"
      - key: USER_COOLDOWN
        value: "2.0"
      - key: MAX_CONCURRENT_REQUESTS
        value: "3"
      - key: MAX_QUEUE_WAIT
        value: "20"
      - key: REQUEST_TIMEOUT
        value: "45"
      - key: MEMORY_TTL_SECONDS
        value: "21600"
      - key: MAX_CONVERSATIONS
        value: "500"
      - key: MEMORY_PRUNE_INTERVAL
        value: "900"
      - key: COOLDOWN_PRUNE_INTERVAL
        value: "3600"
      - key: MAX_COOLDOWN_ENTRIES
        value: "5000"
      - key: GEMINI_THINKING_LEVEL
        value: low
